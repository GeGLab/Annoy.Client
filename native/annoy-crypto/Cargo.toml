[package]
name = "annoy-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_traits = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tls_codec = "0.5"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
strip = true

# Official upstream provider updates; protocol core stays pinned to OpenMLS 0.9.2.
[patch.crates-io]
openmls_rust_crypto = { path = "vendor/openmls_rust_crypto" }
openmls_basic_credential = { path = "vendor/basic_credential" }
