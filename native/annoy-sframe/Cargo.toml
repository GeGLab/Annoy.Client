[package]
name = "annoy-sframe"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

# RFC 9605 frames are produced by the sframe crate; this crate only adapts it
# to an encoded-transform worker. No cryptographic construction lives here.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sframe = { version = "=2.1.0", default-features = false, features = ["rust-crypto"] }
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
panic = "abort"
strip = false
opt-level = "s"
lto = true
