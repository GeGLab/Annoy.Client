name: desktop-validation
on:
  pull_request:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            executable: dist/win-unpacked/Annoy.exe
          - os: ubuntu-latest
            target: --linux --x64
            executable: dist/Annoy-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply the release version before validation and packaging
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
        shell: bash
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox libgbm1 libnss3 libasound2t64
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        shell: bash
        run: node --experimental-transform-types --test scripts/tests/*.test.mjs
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - if: runner.os == 'Linux'
        run: node scripts/verify-native-package.mjs dist/linux-unpacked
      - name: Validate packaged application
        shell: bash
        env:
          ANNOY_PACKAGED_EXECUTABLE: ${{ matrix.executable }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' bash -c 'openbox >/tmp/annoy-test-window-manager.log 2>&1 & node scripts/validate-packaged.mjs'
          else
            node scripts/validate-packaged.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: release-${{ inputs.release_version }}-${{ runner.os }}
          path: |
            dist/Annoy-Setup-x64.exe
            dist/Annoy-Setup-x64.exe.blockmap
            dist/Annoy-x86_64.AppImage
            dist/latest.yml
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
