name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require a merged main commit and choose an unused version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-main-release.mjs
  desktop:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/desktop-validation.yml
    with:
      release_version: ${{ needs.prepare.outputs.version }}
  security:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/security.yml
    with:
      release_version: ${{ needs.prepare.outputs.version }}
    secrets:
      ANNOY_GLOBAL_READ_TOKEN: ${{ secrets.ANNOY_GLOBAL_READ_TOKEN }}
  publish:
    environment: annoy-main-release
    needs: [prepare, desktop, security]
    if: needs.prepare.outputs.publish == 'true' && needs.desktop.result == 'success' && needs.security.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Create the main-line update feeds
        run: |
          cp release-assets/latest.yml release-assets/alpha.yml
          cp release-assets/latest-linux.yml release-assets/alpha-linux.yml
      - name: Sign the exact validated installers
        env:
          ANNOY_RELEASE_SIGNING_KEY: ${{ secrets.ANNOY_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANNOY_RELEASE_SIGNING_KEY" || { echo "::error::Missing environment signing key"; exit 1; }
          umask 077
          annoy_key_file="$RUNNER_TEMP/annoy-release-signing.pem"
          trap 'rm -f "$annoy_key_file"' EXIT
          printf '%s' "$ANNOY_RELEASE_SIGNING_KEY" > "$annoy_key_file"
          node --experimental-strip-types scripts/sign-update.mjs release-assets/Annoy-Setup-x64.exe "$RELEASE_VERSION" win32 x64 annoy-release-2026 "$annoy_key_file" release-assets
          node --experimental-strip-types scripts/sign-update.mjs release-assets/Annoy-x86_64.AppImage "$RELEASE_VERSION" linux x64 annoy-release-2026 "$annoy_key_file" release-assets
          node --experimental-strip-types scripts/verify-release-assets.mjs release-assets "$RELEASE_VERSION"
      - name: Verify uploaded assets and publish only from merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/publish-main-release.mjs release-assets "$RELEASE_VERSION"
      - name: Publication summary
        run: |
          echo "Published v$RELEASE_VERSION from merged main commit $GITHUB_SHA after Windows/Linux validation and signature verification." >> "$GITHUB_STEP_SUMMARY"
