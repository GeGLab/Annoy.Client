# Builds the installers when a GitHub release is published and attaches them,
# together with the latest*.yml files the in-app updater reads.
#
# Versions carry their channel (docs/releases/CHANNELS.md): v0.10.0-alpha.1 and
# v0.10.0-beta.1 are the main line and must be ordinary releases, because
# installs up to 0.9.x look only at GitHub's "latest" release. Nightly and
# unstable builds come from channel-build.yml and must be pre-releases.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require successful CI for the release commit on both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-release-ci.mjs HEAD
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: dist/Annoy-Setup-x64.exe dist/Annoy-Setup-x64.exe.blockmap dist/latest.yml
          - os: ubuntu-latest
            target: --linux
            files: dist/Annoy-x86_64.AppImage dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Releases are built from a draft (workflow_dispatch), signed locally and
      # then published. Publishing must not rebuild: new installers would no
      # longer match the signed manifests.
      - name: Skip when the release already has installers
        id: built
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'latest.yml'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already built and signed; nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.built.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        if: steps.built.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.built.outputs.skip != 'true'
      - name: Check the tag matches package.json
        if: steps.built.outputs.skip != 'true'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Check the channel and the pre-release flag
        if: steps.built.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel="$(printf '%s' "${TAG#v}" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z]+).*/\1/p' | tr A-Z a-z)"
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          case "$channel" in
            ""|alpha|beta) want=false; file=alpha ;;
            nightly|unstable) want=true; file="$channel" ;;
            *) echo "Unknown channel '$channel' in $TAG" >&2; exit 1 ;;
          esac
          if [ "$prerelease" != "$want" ]; then
            echo "$TAG must have pre-release=$want on GitHub (see docs/releases/CHANNELS.md)" >&2; exit 1
          fi
          echo "CHANNEL_FILE=$file" >> "$GITHUB_ENV"
      - run: npm run typecheck
        if: steps.built.outputs.skip != 'true'
      - run: npx electron-vite build
        if: steps.built.outputs.skip != 'true'
      - run: npx electron-builder ${{ matrix.target }} --publish never
        if: steps.built.outputs.skip != 'true'
      - name: Copy the update info for the channel
        if: steps.built.outputs.skip != 'true'
        shell: bash
        run: |
          # The updater asks for <channel>.yml first (alpha.yml on the main line)
          # and falls back to latest.yml; upload both.
          extra=""
          for f in dist/latest*.yml; do
            copy="dist/${CHANNEL_FILE}${f#dist/latest}"; cp "$f" "$copy"; extra="$extra $copy"
          done
          echo "CHANNEL_FILES=$extra" >> "$GITHUB_ENV"
      - name: Upload to the release
        if: steps.built.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.files }} $CHANNEL_FILES --clobber
