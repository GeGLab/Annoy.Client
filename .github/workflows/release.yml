# Builds the installers when a GitHub release is published and attaches them,
# together with the latest*.yml files the in-app updater reads.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: dist/Distopic-Setup-x64.exe dist/Distopic-Setup-x64.exe.blockmap dist/latest.yml
          - os: ubuntu-latest
            target: --linux
            files: dist/Distopic-x86_64.AppImage dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
